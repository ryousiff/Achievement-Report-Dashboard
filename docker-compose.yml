services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kaan:change-me-before-production@postgres:5432/kaan_reports
      MINIO_ENDPOINT: minio
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio

  worker:
    build: .
    restart: unless-stopped
    command: npm run worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kaan:change-me-before-production@postgres:5432/kaan_reports
      MINIO_ENDPOINT: minio
    depends_on:
      - postgres

  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaan_reports
      POSTGRES_USER: kaan
      POSTGRES_PASSWORD: change-me-before-production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me-before-production
      MINIO_ROOT_PASSWORD: change-me-before-production
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
